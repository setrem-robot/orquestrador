# ============================================================
# Mosquitto do ambiente de TESTES — sem autenticação.
# ------------------------------------------------------------
# Montado no lugar de `mosquitto.conf` por `compose.local.yml`. Na VM do LARCC
# vale o outro arquivo, com `password_file` e `allow_anonymous false`.
#
# A senha é o que se tira aqui, e só aqui. O motivo é prático: para publicar a
# primeira mensagem de teste seria preciso gerar um arquivo de senhas, decorá-la
# e passá-la em todo comando — três passos entre você e a primeira tela com
# dados. Num broker que só a sua máquina alcança, isso não compra segurança
# nenhuma; compra desistência.
#
# **Não copie este arquivo para a VM.** Lá o broker recebe conexões de fora, e
# sem senha qualquer um publicaria telemetria falsa no histórico do robô.
# ============================================================

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all
log_timestamp true

listener 1883
protocol mqtt

# A diferença inteira em relação à nuvem está nesta linha.
allow_anonymous true
