# ============================================================
# Ambiente de testes na máquina de quem desenvolve.
# ------------------------------------------------------------
# Usado SEMPRE junto do docker-compose.yml, nunca sozinho:
#
#   docker compose -f docker-compose.yml -f compose.local.yml up -d
#
# ou, mais simples, `./scripts/ambiente-local.sh`, que já faz isso.
#
# POR QUE UM SEGUNDO ARQUIVO, E NÃO UM COMPOSE PRÓPRIO
#
# Um compose separado para desenvolvimento vira, em poucas semanas, uma
# descrição diferente do sistema — e o que se testa aqui deixa de ser o que
# roda lá. Aqui a definição dos serviços é UMA: a de `docker-compose.yml`, a
# mesma que vai para a VM. Este arquivo só ajusta o que precisa ser diferente
# numa máquina de mesa, e a lista é curta de propósito:
#
#   1. as portas escutam na rede local, para o celular alcançar;
#   2. o broker aceita conexão sem senha, para o robô falso publicar;
#   3. sem `cloudflared` — não há domínio apontando para cá.
#
# Migrar para o LARCC é parar de passar este arquivo. Nada mais muda.
#
# NOTA SOBRE O WSL2: os containers sobem dentro do WSL, e o IP do WSL não é o
# IP da sua máquina na rede. Para o celular alcançar, veja
# `docs/ambiente-local.md` — a resposta curta é ligar o modo de rede espelhada
# do WSL2, e são três linhas num arquivo.

services:
  mosquitto:
    # Aberto na rede local: aqui quem publica é o `robo-falso.py` rodando fora
    # do container, e o Pi de verdade, se você quiser apontá-lo para cá.
    ports:
      - "0.0.0.0:1883:1883"
    volumes:
      # Substitui a configuração autenticada da nuvem por uma sem senha. É a
      # única diferença de segurança do ambiente local, e ela existe para o
      # teste não exigir gerar arquivo de senha antes de publicar a primeira
      # mensagem. NÃO use esta configuração na VM: lá o broker está exposto.
      - ./mosquitto/config/mosquitto.local.conf:/mosquitto/config/mosquitto.conf:ro

  timescaledb:
    ports:
      # Continua no loopback: quem precisa do banco são os containers, e um
      # Postgres aberto na rede da faculdade é um problema esperando acontecer.
      # Para inspecionar, use `docker exec -it timescaledb psql -U robo -d robo`.
      - "127.0.0.1:5432:5432"

  ingestor:
    environment:
      # O broker local não pede senha; estas variáveis existem porque o
      # `main.py` as exige, e um valor vazio faria ele pular a autenticação.
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""

  api:
    ports:
      # Escutando na rede local: é por aqui que o celular vai falar com a API.
      - "0.0.0.0:8000:8000"
    environment:
      # `*` porque em desenvolvimento a landing page é servida de onde der na
      # hora — `python -m http.server`, `file://`, outra porta. Na VM isto é o
      # domínio real, e uma origem só.
      CORS_ORIGENS: "*"
      # Log falante: aqui você quer ver cada consulta enquanto ajusta a tela.
      LOG_LEVEL: DEBUG
