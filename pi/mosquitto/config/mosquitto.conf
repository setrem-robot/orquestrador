# --- Persistência ---
# Guarda mensagens retain e filas de QoS>0 entre reinícios.
persistence true
persistence_location /mosquitto/data/

# --- Fila para quando o LARCC estiver fora de alcance ---
# A bridge de telemetria replica com QoS 1 e `cleansession false`, então o que
# não conseguiu subir fica guardado aqui até a VM voltar. O padrão do Mosquitto
# é 1000 mensagens — com o GPS publicando a cada segundo, isso são dezessete
# minutos de queda antes de começar a perder histórico, e uma queda de Wi-Fi
# numa saída de campo passa disso sem esforço.
#
# 100 mil mensagens cobrem cerca de catorze horas no ritmo atual (~2 msg/s
# somando GPS, motores, bateria e Wi-Fi). O teto de bytes é o que
# efetivamente protege o cartão SD: mensagens de telemetria têm ~200 bytes,
# então 32 MiB acabam antes das 100 mil e nenhum dos dois enche o cartão.
max_queued_messages 100000
max_queued_bytes 33554432

# --- Logs ---
# stdout para aparecer em `docker compose logs -f`.
log_dest stdout
log_type all
log_timestamp true

# --- Listener local ---
# No Mosquitto 2.x NÃO há listener nem anonymous por padrão: tudo explícito.
listener 1883
# Tráfego só trafega em loopback (ver port mapping no compose), então
# liberar anônimo aqui é aceitável: são os processos do próprio robô.
# Para endurecer depois, troque por password_file também aqui.
allow_anonymous true

# --- Inclui as configs adicionais (a bridge fica isolada num arquivo próprio,
#     que NÃO vai pro git porque contém a senha do broker remoto) ---
include_dir /mosquitto/config/conf.d